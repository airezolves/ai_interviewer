version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interviewkit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.gateway.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.auth.app:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  resume_parser:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.resume_parser.app:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - ./data/uploads:/app/data/uploads
    working_dir: /app

  ai_engine:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.ai_engine.app:app --host 0.0.0.0 --port 8003 --reload
    ports:
      - "8003:8003"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  kit_manager:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.kit_manager.app:app --host 0.0.0.0 --port 8004 --reload
    ports:
      - "8004:8004"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  pdf_generator:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.pdf_generator.app:app --host 0.0.0.0 --port 8005 --reload
    ports:
      - "8005:8005"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./data/outputs:/app/data/outputs
    working_dir: /app

  billing:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.billing.app:app --host 0.0.0.0 --port 8006 --reload
    ports:
      - "8006:8006"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

volumes:
  postgres_data:
  redis_data:
